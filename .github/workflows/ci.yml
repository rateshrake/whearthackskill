name: VayuShield CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security-test:
    name: Code Quality, Security & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Static Code Hygiene (ESLint)
        run: npm run lint

      - name: Unit & Physics Kernel Coverage (Vitest)
        run: npm run test:coverage

      - name: High-Risk Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Secret Leak Prevention Scan (Google API Keys)
        run: |
          echo "Scanning codebase for exposed Google API Key patterns (AIza...)..."
          if git grep -E -I "AIza[0-9A-Za-z\\-_]{35}" -- ':!package-lock.json' ':!*.test.*'; then
            echo "::error::CRITICAL: High-entropy Google API Key pattern detected in source files!"
            exit 1
          fi
          echo "Zero unencrypted secrets detected in repository."

  e2e-accessibility:
    name: Playwright E2E & Axe-Core Accessibility
    needs: quality-security-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Execute Playwright E2E & Accessibility Suite
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-smoke:
    name: Production Multi-Stage Docker Build
    needs: quality-security-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vayushield:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
